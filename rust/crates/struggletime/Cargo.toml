[package]
name = "struggletime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "StruggleTime desktop app — tray, CLI, and daemon (HTTP API is a separate binary)"

[[bin]]
name = "struggletime"
path = "src/main.rs"

[features]
default = []
# Forward Linux AppIndicator tray (GTK). Used by release CI on Linux.
linux-tray = ["st-tray/linux-tray"]

[dependencies]
st-core = { workspace = true }
st-daemon = { path = "../st-daemon" }
st-helper = { path = "../st-helper" }
st-tray = { path = "../st-tray" }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
